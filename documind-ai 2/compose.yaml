# Optional development database. These credentials are disposable local examples.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: local_only
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - documind_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  documind_pg:
